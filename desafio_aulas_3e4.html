<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Card Responsivo</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <!-- INÍCIO DO CARD -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 max-w-md md:max-w-2xl w-full">

        <!-- Container de Layout -->
        <div class="flex flex-col items-center text-center gap-4 md:flex md:flex-row md:items-center md:text-left">

            <!-- Avatar (Área do Círculo) -->
            <div class="w-16 h-16 shrink-0 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-lg">
                JS
            </div>

            <!-- Informações do Depoimento -->
            <div class="flex flex-col gap-1">
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Desenvolvedor Front-end</span>
                <h1 class="text-lg font-bold text-slate-900">João Silva</h1>
                <p class="text-sm text-slate-600">"O segredo de uma interface incrível não está nas cores, mas no domínio absoluto do espaçamento e da hierarquia visual."</p>

                <button class="mt-3 self-center md:self-start border border-slate-200 rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50">
                    Ver Perfil
                </button>
            </div>

        </div>
    </div>

</body>
</html>
